<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'PingFang SC';
          src: local('PingFang SC');
        }
        @font-face {
          font-family: 'Hiragino Sans GB';
          src: local('Hiragino Sans GB');
        }
        #root {
          position: absolute;
          inset: 0;
          background: #0e1220;
          font-family: "PingFang SC", "Hiragino Sans GB", ui-sans-serif, system-ui, sans-serif;
          color: #f2f5ff;
          overflow: hidden;
        }
        #f06-glow {
          position: absolute;
          right: -280px;
          top: -260px;
          width: 920px;
          height: 920px;
          background: radial-gradient(closest-side, rgba(167, 182, 255, 0.32), rgba(167, 182, 255, 0) 72%);
          opacity: 0.18;
        }
        #f06-ghost {
          position: absolute;
          left: -80px;
          bottom: -130px;
          font-size: 300px;
          font-weight: 800;
          color: #4f7cff;
          opacity: 0.045;
          white-space: nowrap;
          will-change: transform;
        }
        .f06-head {
          position: absolute;
          left: 140px;
          top: 104px;
        }
        #f06-kicker {
          display: inline-block;
          font-size: 24px;
          letter-spacing: 0.4em;
          color: #a7b6ff;
          border: 2px solid rgba(167, 182, 255, 0.4);
          border-radius: 999px;
          padding: 10px 28px 10px 34px;
          will-change: transform, opacity;
        }
        #f06-title {
          font-size: 80px;
          font-weight: 800;
          margin-top: 24px;
          will-change: transform, opacity;
        }
        #f06-note {
          position: absolute;
          right: 140px;
          top: 128px;
          font-size: 26px;
          color: #93a0c2;
          letter-spacing: 0.06em;
          will-change: transform, opacity;
        }
        .f06-rows {
          position: absolute;
          left: 140px;
          top: 360px;
          width: 1640px;
          display: flex;
          flex-direction: column;
          gap: 22px;
        }
        .f06-row {
          height: 104px;
          border-radius: 18px;
          background: #151b2e;
          border: 2px solid rgba(167, 182, 255, 0.12);
          display: flex;
          align-items: center;
          padding: 0 44px;
          gap: 28px;
          will-change: transform, opacity;
        }
        .f06-row .sq {
          width: 18px;
          height: 18px;
          border-radius: 5px;
        }
        .f06-row .name {
          font-size: 40px;
          font-weight: 700;
          letter-spacing: 0.02em;
        }
        .f06-row .tag {
          margin-left: auto;
          font-size: 28px;
          color: #93a0c2;
          letter-spacing: 0.08em;
        }
        .f06-row .tag .em {
          color: #c9d4f2;
        }
        #f06-honest {
          position: absolute;
          left: 140px;
          top: 924px;
          width: 1640px;
          height: 92px;
          border-radius: 18px;
          border: 2px solid rgba(62, 207, 111, 0.45);
          background: rgba(62, 207, 111, 0.07);
          display: flex;
          align-items: center;
          padding: 0 40px;
          gap: 20px;
          opacity: 0;
          will-change: transform, opacity;
        }
        #f06-honest .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #3ecf6f;
        }
        #f06-honest .txt {
          font-size: 28px;
          color: #c9d4f2;
          letter-spacing: 0.03em;
        }
        #f06-honest .badge {
          font-size: 24px;
          font-weight: 700;
          color: #3ecf6f;
          border: 2px solid rgba(62, 207, 111, 0.55);
          border-radius: 8px;
          padding: 3px 14px;
          letter-spacing: 0.14em;
        }
      </style>

      <div id="root" data-composition-id="f06-standards" data-width="1920" data-height="1080">
        <div id="f06-glow" data-layout-ignore="true"></div>
        <div id="f06-ghost" data-layout-allow-overflow="true">FORMAT</div>

        <div class="f06-head">
          <div id="f06-kicker">生态</div>
          <div id="f06-title">标准格式，直接渲染</div>
        </div>
        <div id="f06-note">不造私有格式，也不挑格式</div>

        <div class="f06-rows">
          <div class="f06-row" id="f06-r1">
            <span class="sq" style="background: #4f7cff"></span>
            <span class="name">dotLottie</span>
            <span class="tag"><span class="em">ZIP 直读</span>，无需转换</span>
          </div>
          <div class="f06-row" id="f06-r2">
            <span class="sq" style="background: #a7b6ff"></span>
            <span class="name">Live2D</span>
            <span class="tag"><span class="em">motion3</span> 官方数据驱动</span>
          </div>
          <div class="f06-row" id="f06-r3">
            <span class="sq" style="background: #3ecf6f"></span>
            <span class="name">GIF</span>
            <span class="tag"><span class="em">object-fit</span> 完整支持</span>
          </div>
          <div class="f06-row" id="f06-r4">
            <span class="sq" style="background: #4f7cff"></span>
            <span class="name">Markdown / JSON / CSV</span>
            <span class="tag"><span class="em">直染</span>为原生界面</span>
          </div>
        </div>

        <div id="f06-honest">
          <span class="dot"></span>
          <span class="badge">诚实边界</span>
          <span class="txt">moc3 专有格式不解析 —— 以官方 motion 数据驱动自有 rig 替代</span>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#f06-kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.18, ease: "power4.out" }, 0.2);
        tl.fromTo("#f06-title", { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, 0.34);
        tl.fromTo("#f06-note", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);

        // rows cascade in, left whip
        ["#f06-r1", "#f06-r2", "#f06-r3", "#f06-r4"].forEach((sel, i) => {
          tl.fromTo(sel, { opacity: 0, x: -90 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.95 + i * 0.55);
        });

        // honesty note: fade up late and hold
        tl.fromTo("#f06-honest", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 4.8);

        const ghost = document.getElementById("f06-ghost");
        const gp = { p: 0 };
        tl.to(
          gp,
          {
            p: Math.PI * 2 * 4.2,
            duration: 13.4,
            ease: "none",
            onUpdate: () => {
              ghost.style.transform = `translate(${Math.sin(gp.p) * 12}px, ${Math.cos(gp.p) * -6}px)`;
            },
          },
          0.5,
        );

        window.__timelines["f06-standards"] = tl;
      </script>
    </template>
  </body>
</html>
