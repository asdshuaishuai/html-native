<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'PingFang SC';
          src: local('PingFang SC');
        }
        @font-face {
          font-family: 'Hiragino Sans GB';
          src: local('Hiragino Sans GB');
        }
        #root {
          position: absolute;
          inset: 0;
          background: #0e1220;
          font-family: "PingFang SC", "Hiragino Sans GB", ui-sans-serif, system-ui, sans-serif;
          color: #f2f5ff;
          overflow: hidden;
        }
        #f02-glow {
          position: absolute;
          right: -240px;
          top: -220px;
          width: 900px;
          height: 900px;
          background: radial-gradient(closest-side, rgba(79, 124, 255, 0.4), rgba(79, 124, 255, 0) 72%);
          opacity: 0.18;
          will-change: transform;
        }
        #f02-ghost {
          position: absolute;
          left: -60px;
          bottom: -130px;
          font-size: 300px;
          font-weight: 800;
          color: #a7b6ff;
          opacity: 0.04;
          white-space: nowrap;
          will-change: transform;
        }
        .f02-head {
          position: absolute;
          left: 140px;
          top: 108px;
        }
        #f02-kicker {
          display: inline-block;
          font-size: 24px;
          letter-spacing: 0.4em;
          color: #a7b6ff;
          border: 2px solid rgba(167, 182, 255, 0.4);
          border-radius: 999px;
          padding: 10px 28px 10px 34px;
          will-change: transform, opacity;
        }
        #f02-title {
          font-size: 84px;
          font-weight: 800;
          margin-top: 26px;
          will-change: transform, opacity;
        }
        #f02-note {
          position: absolute;
          right: 140px;
          top: 130px;
          font-size: 26px;
          color: #93a0c2;
          letter-spacing: 0.08em;
          will-change: transform, opacity;
        }
        .f02-cards {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 388px;
          display: flex;
          gap: 40px;
        }
        .f02-card {
          width: 540px;
          height: 520px;
          background: #151b2e;
          border: 2px solid rgba(167, 182, 255, 0.14);
          border-radius: 24px;
          padding: 46px 44px;
          position: relative;
          will-change: transform, opacity;
        }
        .f02-card .bar {
          width: 88px;
          height: 6px;
          border-radius: 3px;
          transform-origin: left center;
          will-change: transform;
        }
        .f02-card .num {
          font-size: 120px;
          font-weight: 800;
          line-height: 1;
          margin-top: 34px;
          opacity: 0.92;
          font-variant-numeric: tabular-nums;
        }
        .f02-card .t {
          font-size: 41px;
          font-weight: 700;
          line-height: 1.35;
          margin-top: 36px;
          min-height: 112px;
        }
        .f02-card .s {
          font-size: 28px;
          color: #93a0c2;
          margin-top: 18px;
          line-height: 1.5;
        }
        .f02-card .s .em {
          color: #c9d4f2;
        }
      </style>

      <div id="root" data-composition-id="f02-walls" data-width="1920" data-height="1080">
        <div id="f02-glow" data-layout-ignore="true"></div>
        <div id="f02-ghost" data-layout-allow-overflow="true">WALL</div>

        <div class="f02-head">
          <div id="f02-kicker">现状</div>
          <div id="f02-title">三堵墙</div>
        </div>
        <div id="f02-note">agent 拿到 HTML 之后，路在哪里？</div>

        <div class="f02-cards">
          <div class="f02-card" id="f02-c1">
            <div class="bar" style="background: #4f7cff"></div>
            <div class="num" style="color: #4f7cff">01</div>
            <div class="t">WebView 内核百兆起步</div>
            <div class="s"><span class="em">内存黑洞</span>，为了画一个窗口背上整个浏览器</div>
          </div>
          <div class="f02-card" id="f02-c2">
            <div class="bar" style="background: #a7b6ff"></div>
            <div class="num" style="color: #a7b6ff">02</div>
            <div class="t">AI 生成 UI 不可验证</div>
            <div class="s">渲染结果没有<span class="em">机器口径</span>，对不对全靠人眼</div>
          </div>
          <div class="f02-card" id="f02-c3">
            <div class="bar" style="background: #3ecf6f"></div>
            <div class="num" style="color: #3ecf6f">03</div>
            <div class="t">桌面形态缺位</div>
            <div class="s">agent 会画网页，<span class="em">住不进桌面</span></div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#f02-kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.18, ease: "power4.out" }, 0.2);
        tl.fromTo("#f02-title", { opacity: 0, y: 66 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, 0.34);
        tl.fromTo("#f02-note", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);

        // cards slide up in sequence (binary arrival + whip)
        const cards = ["#f02-c1", "#f02-c2", "#f02-c3"];
        cards.forEach((sel, i) => {
          const at = 1.0 + i * 0.62;
          tl.fromTo(sel, { opacity: 0, y: 96 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);
          tl.fromTo(sel + " .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at + 0.18);
        });

        // ambient: very low drift on the three cards, staggered periods
        const el1 = document.getElementById("f02-c1");
        const el2 = document.getElementById("f02-c2");
        const el3 = document.getElementById("f02-c3");
        const ph = { p: 0 };
        tl.to(
          ph,
          {
            p: Math.PI * 2 * 3.4,
            duration: 8.2,
            ease: "none",
            onUpdate: () => {
              el1.style.transform = `translateY(${Math.sin(ph.p) * 2.5}px)`;
              el2.style.transform = `translateY(${Math.sin(ph.p + 1.1) * 2.5}px)`;
              el3.style.transform = `translateY(${Math.sin(ph.p + 2.2) * 2.5}px)`;
            },
          },
          3.6,
        );

        const ghost = document.getElementById("f02-ghost");
        const gp = { p: 0 };
        tl.to(
          gp,
          {
            p: Math.PI * 2 * 1.2,
            duration: 8.6,
            ease: "none",
            onUpdate: () => {
              ghost.style.transform = `translate(${Math.sin(gp.p) * -12}px, 0)`;
            },
          },
          0.4,
        );

        window.__timelines["f02-walls"] = tl;
      </script>
    </template>
  </body>
</html>
