<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'PingFang SC';
          src: local('PingFang SC');
        }
        @font-face {
          font-family: 'Hiragino Sans GB';
          src: local('Hiragino Sans GB');
        }
        #root {
          position: absolute;
          inset: 0;
          background: #0e1220;
          font-family: "PingFang SC", "Hiragino Sans GB", ui-sans-serif, system-ui, sans-serif;
          color: #f2f5ff;
          overflow: hidden;
        }
        #f05-glow {
          position: absolute;
          left: 50%;
          top: 520px;
          width: 1500px;
          height: 700px;
          margin-left: -750px;
          background: radial-gradient(closest-side, rgba(79, 124, 255, 0.4), rgba(79, 124, 255, 0) 72%);
          opacity: 0;
          will-change: transform, opacity;
        }
        #f05-ghost {
          position: absolute;
          right: -90px;
          bottom: -140px;
          font-size: 330px;
          font-weight: 800;
          color: #a7b6ff;
          opacity: 0.04;
          white-space: nowrap;
          will-change: transform;
        }
        .f05-head {
          position: absolute;
          left: 140px;
          top: 104px;
        }
        #f05-kicker {
          display: inline-block;
          font-size: 24px;
          letter-spacing: 0.4em;
          color: #a7b6ff;
          border: 2px solid rgba(167, 182, 255, 0.4);
          border-radius: 999px;
          padding: 10px 28px 10px 34px;
          will-change: transform, opacity;
        }
        #f05-title {
          font-size: 80px;
          font-weight: 800;
          margin-top: 24px;
          will-change: transform, opacity;
        }
        #f05-note {
          position: absolute;
          right: 140px;
          top: 128px;
          font-size: 26px;
          color: #93a0c2;
          letter-spacing: 0.06em;
          will-change: transform, opacity;
        }
        .f05-cards {
          position: absolute;
          left: 100px;
          top: 372px;
          display: flex;
          gap: 40px;
        }
        .f05-card {
          width: 400px;
          height: 440px;
          background: #151b2e;
          border: 2px solid rgba(167, 182, 255, 0.14);
          border-radius: 24px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .f05-numwrap {
          display: flex;
          align-items: baseline;
          justify-content: center;
          width: 100%;
        }
        .f05-num {
          font-size: 128px;
          font-weight: 800;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          display: inline-block;
          transform-origin: center center;
          will-change: transform;
        }
        .f05-suffix {
          font-size: 64px;
          font-weight: 800;
          margin-left: 6px;
          opacity: 0;
          will-change: transform, opacity;
        }
        .f05-label {
          font-size: 30px;
          color: #93a0c2;
          letter-spacing: 0.1em;
          will-change: transform, opacity;
        }
        #f05-cert {
          position: absolute;
          left: 0;
          right: 0;
          top: 918px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          font-size: 34px;
          color: #dbe4ff;
          letter-spacing: 0.06em;
          opacity: 0;
          will-change: transform, opacity;
        }
        #f05-cert .dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #3ecf6f;
        }
        #f05-cert .em {
          color: #3ecf6f;
          font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="f05-metrics" data-width="1920" data-height="1080">
        <div id="f05-glow" data-layout-ignore="true"></div>
        <div id="f05-ghost" data-layout-allow-overflow="true">C99</div>

        <div class="f05-head">
          <div id="f05-kicker">指标</div>
          <div id="f05-title">关键数字</div>
        </div>
        <div id="f05-note">每一个口径，都有探针对账</div>

        <div class="f05-cards">
          <div class="f05-card" id="f05-c1">
            <div class="f05-numwrap"><span class="f05-num" id="f05-n1">0.0</span><span class="f05-suffix" style="color: #4f7cff" id="f05-s1">k</span></div>
            <div class="f05-label">行纯 C99</div>
          </div>
          <div class="f05-card" id="f05-c2">
            <div class="f05-numwrap"><span class="f05-num" id="f05-n2">0</span><span class="f05-suffix" style="color: #a7b6ff" id="f05-s2">+</span></div>
            <div class="f05-label">探针断言</div>
          </div>
          <div class="f05-card" id="f05-c3">
            <div class="f05-numwrap"><span class="f05-num" id="f05-n3">0</span></div>
            <div class="f05-label">类绘制指令</div>
          </div>
          <div class="f05-card" id="f05-c4">
            <div class="f05-numwrap"><span class="f05-num" id="f05-n4">0</span></div>
            <div class="f05-label">外部依赖 / SDK</div>
          </div>
        </div>

        <div id="f05-cert"><span class="dot"></span><span>跨架构确定性：同一文档，<span class="em">逐位一致</span></span></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#f05-kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.18, ease: "power4.out" }, 0.2);
        tl.fromTo("#f05-title", { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, 0.34);
        tl.fromTo("#f05-note", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);

        // cards stamp in one by one (smooth settle, no bounce)
        const CARDS = [
          { el: "#f05-c1", at: 0.9, num: "#f05-n1", sfx: "#f05-s1", target: 20.6, decimals: 1 },
          { el: "#f05-c2", at: 1.7, num: "#f05-n2", sfx: "#f05-s2", target: 1145, decimals: 0 },
          { el: "#f05-c3", at: 2.5, num: "#f05-n3", sfx: null, target: 10, decimals: 0 },
          { el: "#f05-c4", at: 3.3, num: null, sfx: null, target: 0, decimals: 0 },
        ];

        CARDS.forEach((c) => {
          tl.fromTo(c.el, { scale: 0, opacity: 0, y: 26 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, c.at);
        });

        // count-ups (value proxy + scale growth share timing and ease)
        const n1 = document.getElementById("f05-n1");
        const n2 = document.getElementById("f05-n2");
        const n3 = document.getElementById("f05-n3");
        const COUNT_AT = 1.2;
        const COUNT_DUR = 1.7;
        const st1 = { v: 0 };
        tl.to(st1, { v: 20.6, duration: COUNT_DUR, ease: "power3.out", onUpdate: () => { n1.textContent = st1.v.toFixed(1); } }, COUNT_AT);
        tl.fromTo(n1, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
        const st2 = { v: 0 };
        tl.to(st2, { v: 1145, duration: COUNT_DUR, ease: "power3.out", onUpdate: () => { n2.textContent = String(Math.round(st2.v)); } }, COUNT_AT + 0.8);
        tl.fromTo(n2, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT + 0.8);
        const st3 = { v: 0 };
        tl.to(st3, { v: 10, duration: COUNT_DUR, ease: "power3.out", onUpdate: () => { n3.textContent = String(Math.round(st3.v)); } }, COUNT_AT + 1.6);
        tl.fromTo(n3, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT + 1.6);

        // suffixes land after each count
        tl.fromTo("#f05-s1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, COUNT_AT + COUNT_DUR);
        tl.fromTo("#f05-s2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, COUNT_AT + 0.8 + COUNT_DUR);

        // glow blooms behind the finished row, then breathes
        tl.fromTo("#f05-glow", { opacity: 0, scale: 0.92 }, { opacity: 0.24, scale: 1, duration: 1.0, ease: "power2.out" }, 4.1);
        const glow = document.getElementById("f05-glow");
        const ph = { p: 0 };
        tl.to(
          ph,
          {
            p: Math.PI * 2 * 2.6,
            duration: 8.6,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(ph.p);
              glow.style.opacity = String(0.24 + s * 0.03);
              glow.style.transform = `scale(${1 + s * 0.012})`;
            },
          },
          5.1,
        );

        // determinism line
        tl.fromTo("#f05-cert", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.6);

        const ghost = document.getElementById("f05-ghost");
        const gp = { p: 0 };
        tl.to(
          gp,
          {
            p: Math.PI * 2 * 1.4,
            duration: 9.0,
            ease: "none",
            onUpdate: () => {
              ghost.style.transform = `translate(${Math.sin(gp.p) * -12}px, 0)`;
            },
          },
          0.6,
        );

        window.__timelines["f05-metrics"] = tl;
      </script>
    </template>
  </body>
</html>
