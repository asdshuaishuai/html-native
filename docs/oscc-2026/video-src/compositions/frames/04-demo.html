        #f04-progress {

          top: 984px;

          width: 96px;
          height: 8px;

          overflow: hidden;
        }
        .f04-slot .fill {
          width: 100%;
          height: 100%;
          background: #4f7cff;
          transform-origin: left center;
          will-change: transform;
        }
      </style>

      <div id="root" data-composition-id="f04-demo" data-width="1920" data-height="1080">
        <!-- segment 1: 数据大屏 -->

          data-track-index="2"

        <!-- segment 2: 透明桌宠 -->
        <video
          id="f04-v2"
          class="f04-video"
          src="../../assets/neb-demo-p1.mov"
          muted

          data-start="4.5"
          data-duration="4.5"
          data-media-start="11.5"
          data-track-index="2"

        <!-- segment 3: Live2D 数字人 -->
        <video
          id="f04-v3"

          src="../../assets/neb-demo-p1.mov"
          muted

          data-media-start="18"
          data-track-index="2"
        ></video>
        <!-- segment 4: 媒体窗 GPU 合成 -->
        <video
          id="f04-v4"
          class="f04-video"
          src="../../assets/neb-demo-p1.mov"
          muted
          playsinline

          data-duration="4.5"
          data-media-start="27"

        <!-- segment 5: 流式会话 -->

          src="../../assets/neb-demo-p2.mov"
          muted

          data-duration="5.5"
          data-media-start="16.5"
          data-track-index="2"
        ></video>

        <div id="f04-topline" data-layout-ignore="true"></div>
        <div id="f04-botline" data-layout-ignore="true"></div>

        <div id="f04-meta">实机演示 · 真实桌面录屏</div>

        <div class="f04-label clip" id="f04-lb1" data-start="0" data-duration="4.5">
          <span class="idx">1/6</span><span class="txt">数据大屏</span>
        </div>
        <div class="f04-label clip" id="f04-lb2" data-start="4.5" data-duration="4.5">
          <span class="idx">2/6</span><span class="txt">透明桌宠</span>
        </div>
        <div class="f04-label clip" id="f04-lb3" data-start="9" data-duration="5.5">
          <span class="idx">3/6</span><span class="txt">Live2D 数字人</span>
        </div>
        <div class="f04-label clip" id="f04-lb4" data-start="14.5" data-duration="4.5">
          <span class="idx">4/6</span><span class="txt">媒体窗 GPU 合成</span>
        </div>
        <div class="f04-label clip" id="f04-lb5" data-start="19" data-duration="5.5">

        </div>
        <div class="f04-label clip" id="f04-lb6" data-start="24.5" data-duration="5.5">
          <span class="idx">6/6</span><span class="txt">多窗同屏</span>
        </div>

        <div class="f04-caption clip" id="f04-cap1" data-start="0" data-duration="4.5">
          <span class="line"><span class="cur">▍</span>agent 写下的 HTML，直驱数据大屏关键帧动画</span>
        </div>
        <div class="f04-caption clip" id="f04-cap2" data-start="4.5" data-duration="4.5">
          <span class="line"><span class="cur">▍</span>透明原生窗，悬浮在真实桌面之上</span>
        </div>
        <div class="f04-caption clip" id="f04-cap3" data-start="9" data-duration="5.5">
          <span class="line"><span class="cur">▍</span>Live2D 官方 motion3 数据驱动数字人</span>
        </div>
        <div class="f04-caption clip" id="f04-cap4" data-start="14.5" data-duration="4.5">
          <span class="line"><span class="cur">▍</span>真窗 video 标签 · AVPlayerLayer GPU 合成</span>
        </div>
        <div class="f04-caption clip" id="f04-cap5" data-start="19" data-duration="5.5">
          <span class="line"><span class="cur">▍</span>agent 逐句推送，原生窗即时呈现</span>
        </div>
        <div class="f04-caption clip" id="f04-cap6" data-start="24.5" data-duration="5.5">
          <span class="line"><span class="cur">▍</span>多个原生窗同屏共存，互不干扰</span>
        </div>

        <div id="f04-progress">
          <div class="f04-slot"><div class="fill" id="f04-p1"></div></div>
          <div class="f04-slot"><div class="fill" id="f04-p2"></div></div>
          <div class="f04-slot"><div class="fill" id="f04-p3"></div></div>
          <div class="f04-slot"><div class="fill" id="f04-p4"></div></div>
          <div class="f04-slot"><div class="fill" id="f04-p5"></div></div>
          <div class="f04-slot"><div class="fill" id="f04-p6"></div></div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        const SEG = [
          { lb: "#f04-lb1", cap: "#f04-cap1 .line", fill: "#f04-p1", start: 0, dur: 4.5 },
          { lb: "#f04-lb2", cap: "#f04-cap2 .line", fill: "#f04-p2", start: 4.5, dur: 4.5 },
          { lb: "#f04-lb3", cap: "#f04-cap3 .line", fill: "#f04-p3", start: 9, dur: 5.5 },
          { lb: "#f04-lb4", cap: "#f04-cap4 .line", fill: "#f04-p4", start: 14.5, dur: 4.5 },
          { lb: "#f04-lb5", cap: "#f04-cap5 .line", fill: "#f04-p5", start: 19, dur: 5.5 },
          { lb: "#f04-lb6", cap: "#f04-cap6 .line", fill: "#f04-p6", start: 24.5, dur: 5.5 },
        ];

        tl.fromTo("#f04-meta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);

        SEG.forEach((s) => {
          // label text whips in from the left (inner span, never the clip)
          tl.fromTo(
            s.lb + " .txt",
            { opacity: 0, x: -40 },
            { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" },
            s.start + 0.05,
          );
          // caption rises in
          tl.fromTo(
            s.cap,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
            s.start + 0.15,
          );
          // progress fill sweeps across the segment (linear, lands just before the cut)
          tl.fromTo(
            s.fill,
            { scaleX: 0 },
            { scaleX: 1, duration: s.dur - 0.15, ease: "none" },
            s.start + 0.05,
          );
        });

        window.__timelines["f04-demo"] = tl;
      </script>
    </template>
  </body>
</html>
