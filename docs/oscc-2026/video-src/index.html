<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e1220;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="99"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-cover"
        data-composition-id="f01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-walls"
        data-composition-id="f02-walls"
        data-composition-src="compositions/frames/02-walls.html"
        data-start="6"
        data-duration="12"
        data-track-index="1"
      ></div>
      <div
        id="el-architecture"
        data-composition-id="f03-architecture"
        data-composition-src="compositions/frames/03-architecture.html"
        data-start="18"
        data-duration="12"
        data-track-index="1"
      ></div>
      <div
        id="el-demo"
        data-composition-id="f04-demo"
        data-composition-src="compositions/frames/04-demo.html"
        data-start="30"
        data-duration="30"
        data-track-index="1"
      ></div>
      <div
        id="el-metrics"
        data-composition-id="f05-metrics"
        data-composition-src="compositions/frames/05-metrics.html"
        data-start="60"
        data-duration="14"
        data-track-index="1"
      ></div>
      <div
        id="el-standards"
        data-composition-id="f06-standards"
        data-composition-src="compositions/frames/06-standards.html"
        data-start="74"
        data-duration="14"
        data-track-index="1"
      ></div>
      <div
        id="el-ending"
        data-composition-id="f07-ending"
        data-composition-src="compositions/frames/07-ending.html"
        data-start="88"
        data-duration="11"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
