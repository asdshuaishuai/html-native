<html><head>
<!-- frameless-demo — 透明 + 无边框 + 可拖拽 + 点击穿透区域(演示页)
     ================================================================
     一页摆出桌宠形态的四个根基开关, 每个都有"看得见"的对照物:
       hn-transparent="1"   逐像素 alpha: 页面无底色, 桌面从透明处透出
       hn-frameless="1"     无标题栏无边框: 窗口矩形不可见, 内容即窗口
       hn-draggable="1"     无边框拖拽: **可见像素**即拖动面(拖拽命中区
                            只在有像素的内容上 —— 全透明处按下去不拖窗)
       (无 hn-click-through) 整窗幽灵模式不在此页 —— 本页演示的是
                            **逐像素**穿透: 全透明像素点击落到桌面,
                            半透明/不透明像素照常可点

     三块对照区(对应平台实现的逐像素命中口径):
       ① 左侧半透明卡片   rgba 背景(alpha≈0.85) —— 可点可拖: 按钮计数
                          走 hnSetText, 按住卡片拖动整窗
       ② 右上细线幽灵框   框内**零像素**(只有 1px 边线是可见像素) ——
                          点框内 = 穿透到桌面/下层窗口, 页面无任何反应;
                          点边线 = 可见像素, 照常命中
       ③ 不透明色块       alpha=1 对照 —— 与②直线距离最近, 行为两极

     平台差异(诚实口径, 同 platform/hnp_macos.c / hnp_linux.c 注释):
       macOS  WindowServer 对非不透明窗口逐像素路由 + 视图 hitTest 覆写:
              全透明处点击在系统层就不进本应用
       Linux  X11 无逐像素输入路由, 壳在引擎出口过滤(hnp_pump): 全透明处
              按下不进引擎、不发起拖拽; 原生层仍会聚焦(已知差异, 见
              hnp_linux.c 文件头"对齐矩阵")
       两边共同语义: **全透明 → 穿透, 半透明 → 可点**, 不透明 → 可点。

     渲染(静态截图取首帧): 计数器/点击回显是运行期行为, 离屏单帧含
     初始文案(计数 0 / "等待第一次点击"); 交互需真窗:
       dist/hnapp-macos-arm64 examples/frameless-demo.html
       (cd examples && ../dist/hncore-macos-arm64 render frameless-demo.html \
          ../screenshots/frameless-demo.png 460x300)
-->
<meta charset="utf-8">
<meta name="hn-surface" content="popup">
<meta name="hn-window" content="460x300">
<meta name="hn-title" content="hn 无边框 + 穿透演示">
<meta name="hn-transparent" content="1">
<meta name="hn-frameless" content="1">
<meta name="hn-level" content="floating">
<meta name="hn-spaces" content="all">
<meta name="hn-shadow" content="0">
<meta name="hn-draggable" content="1">
<style>
  /* 无底色: 桌面从透明处透出(声明 hn-transparent 时引擎也会剥离根底色) */
  html, body { margin: 0; width: 100%; height: 100%; }

  /* ---- ① 半透明交互卡: 可点 + 可拖的主体 ----
     注意: border 简写里的颜色函数不能带空格(引擎 CSS 分词按空白切,
     rgba(140, 160, 200, 0.65) 会碎成多个 token 解析失败 → 边框静默不画;
     无空格单 token 或 #RRGGBBAA 都可以)。
     卡片只上"圆角底色"不上边框: 引擎光栅的圆角描边目前只画圆角弧、
     直线边缺失(隔离实验 /tmp 证实 r=0 完整 / r>0 只有四角), 绕开。 */
  .card { position: absolute; left: 18; top: 20; width: 236; box-sizing: border-box;
          padding: 12 14; background: rgba(24, 30, 42, 0.85);
          border-radius: 14; }
  .title { color: #f2f5fb; font-size: 13; font-weight: 700; }
  .sub   { color: #aab4c8; font-size: 10; margin-top: 2; }
  .btnrow { display: flex; gap: 8; margin-top: 10; }
  .btn { background: #4f7cff; color: #fff; border-radius: 8; padding: 6 12;
         font-size: 11; font-weight: 600; text-align: center; }
  .btn.ghosty { background: rgba(79, 124, 255, 0.45); }   /* 半透明按钮: 可点 */
  .readout { margin-top: 10; background: rgba(12, 16, 26, 0.65);
             border-radius: 8;
             padding: 6 9; font-size: 10; color: #9fe8b9; }
  .drag-hint { margin-top: 8; font-size: 10; color: #ffd479; }

  /* ---- ② 穿透对照: 细线框内零像素(只有 1px 边线是可见像素) ----
     方角(radius 0): 引擎光栅的圆角描边只画圆角弧、直边缺失(r=0 的
     矩形描边完整, 见上方卡片注释)—— 穿透对照区要的是"完整的一条边线",
     用方角。注: 引擎接受 dashed/dotted 关键字但边框统一按实线画。 */
  .ghost { position: absolute; left: 274; top: 20; width: 168; height: 148;
           border: 1 solid rgba(140,160,200,0.75); }
  .ghost-tag { position: absolute; left: 284; top: 178; width: 150;
               font-size: 10; color: #8ea3c9; text-align: center; }

  /* ---- ③ 不透明对照块 ---- */
  .solid { position: absolute; left: 274; top: 226; width: 168; box-sizing: border-box;
           background: #33d6a6; color: #083b2b; border-radius: 10; padding: 8 10;
           font-size: 11; font-weight: 700; text-align: center; }
</style>
</head><body>
  <!-- ① 半透明卡(可点可拖): 按钮点击经 addEventListener → hnSetText 回显 -->
  <div class="card" id="card">
    <div class="title">无边框 + 逐像素穿透</div>
    <div class="sub">这张卡是半透明像素 —— 可点, 也可按住拖动整窗</div>
    <div class="btnrow">
      <div class="btn" id="btn-count">点我 +1</div>
      <div class="btn ghosty" id="btn-hello">半透明按钮</div>
    </div>
    <div class="readout" id="readout">计数 0 · 等待第一次点击</div>
    <div class="drag-hint">✋ 按住本卡任意可见处拖走窗口</div>
  </div>

  <!-- ② 穿透对照: 框内没有任何像素 —— 点它, 事件落到桌面/下层窗口 -->
  <div class="ghost" id="ghost"></div>
  <div class="ghost-tag">细线框内零像素: 点击穿透到桌面<br>(边线本身可点/可拖)</div>

  <!-- ③ 不透明对照 -->
  <div class="solid" id="solid">不透明色块 · 点击有回显</div>

<script>
  /* 半透明处可点的最小证明: 两个按钮 + 不透明块各挂一个计数器,
     经 hnSetText 回显(与 pet.html 气泡同一布局绘制管线)。 */
  var clicks = 0;
  function echo(msg) {
    hnSetText('readout', msg);
  }
  function bump(tag) {
    clicks++;
    echo('计数 ' + clicks + ' · 来自 ' + tag);
  }
  document.getElementById('btn-count').addEventListener('click', function () { bump('不透明按钮'); });
  document.getElementById('btn-hello').addEventListener('click', function () { bump('半透明按钮'); });
  document.getElementById('solid').addEventListener('click', function () { bump('不透明色块'); });
  /* 幽灵框的**边线**是可见像素, 可点(框内零像素, 点击穿透 —— 页面无反应
     就是穿透成功的表现); 这里给边线挂监听作对照。 */
  document.getElementById('ghost').addEventListener('click', function () { bump('细线边'); });
</script>
</body></html>
