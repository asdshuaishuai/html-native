<html><head>
<meta charset="utf-8"><style>
body { margin: 0; padding: 26; background: #101a33; }
.row { display: flex; align-items: center; gap: 10; margin-bottom: 14; }
.tag { color: #8fa3c8; font-size: 11; width: 230; }
/* A: 页面同构 flex meter */
.meter { display: flex; align-items: center; gap: 10; width: 400; }
.m-name { width: 62; font-size: 11; color: #8fa3c8; font-weight: 700; }
.m-track { flex: 1; height: 8; border-radius: 999; background: rgba(255,255,255,.10); overflow: hidden; }
.m-fill { height: 8; border-radius: 999; background: linear-gradient(90deg, #ff6b9d, #ffd166, #06d6a0, #4f9dff); }
/* B: 定宽 track */
.tk2 { width: 300; height: 8; border-radius: 999; background: rgba(255,255,255,.10); overflow: hidden; }
/* C: 无 overflow hidden */
.tk3 { width: 300; height: 8; border-radius: 999; background: rgba(255,255,255,.10); }
/* D: ui-kit 原样 */
.progress { width: 300; height: 6; background: #262e3d; border-radius: 3; overflow: hidden; }
.progress-fill { height: 6; background: linear-gradient(90deg, #4f9dff, #2a5fd0); border-radius: 3; }
</style></head><body>
<div class="row"><div class="tag">A flex track fill 72%</div>
  <div class="meter"><span class="m-name">发射能量</span><div class="m-track"><div class="m-fill" style="width:72%"></div></div></div>
</div>
<div class="row"><div class="tag">B fixed track fill 72%</div>
  <div class="tk2"><div class="m-fill" style="width:72%"></div></div>
</div>
<div class="row"><div class="tag">C no overflow fill 216px</div>
  <div class="tk3"><div class="m-fill" style="width:216"></div></div>
</div>
<div class="row"><div class="tag">D ui-kit style fill 64%</div>
  <div class="progress"><div class="progress-fill" style="width:64%"></div></div>
</div>
</body></html>
