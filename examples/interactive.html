<html><head>
<meta charset="utf-8"><style>
body { margin: 0; padding: 22; background: #12151c; }
h2 { color: #e8eaf0; font-size: 17; margin: 0 0 4 0; }
.sub { color: #6b7386; font-size: 12; margin: 0 0 18 0; }
.tile { border-radius: 12; padding: 16; margin-bottom: 12; background: #1b212c;
        border: 1 solid #2b3444; transition: 250ms; }
.tile:hover { background: #23324f; border-color: #4f7cff; }
.tile-title { color: #e8eaf0; font-size: 14; font-weight: 700; margin-bottom: 6; }
.tile-body { color: #9aa3b5; font-size: 12; }
.pulse { border-radius: 10; padding: 14; background: #1e2637; }
.pulse-live { color: #3ecf6f; font-size: 12; font-weight: 700; }
.row { display: flex; gap: 10; }
input { flex: 1; background: #1b212c; border: 1 solid #2b3444; border-radius: 8;
        color: #e8eaf0; font-size: 13px; box-sizing: border-box; transition: 200ms; }
input:focus { border: 2 solid #4f7cff; background: #1e2637; }
button { background: #4f7cff; color: #fff; padding: 10 18; border-radius: 8;
         text-align: center; font-weight: 600; font-size: 13; transition: 150ms; }
button:hover { background: #6b8dff; }
.note { color: #6b7386; font-size: 11; margin-top: 12; }
</style></head><body>
<h2>交互能力</h2>
<div class="sub">行内排版 · 输入控件 · 过渡动画 · 轮询触发</div>

<div class="tile" id="tile-a">
  <div class="tile-title">过渡动画</div>
  <div class="tile-body">background / border-color 经 transition 插值, 由运行时帧循环驱动。</div>
</div>

<div class="tile pulse">
  <div class="tile-title">轮询触发 <span class="pulse-live">● LIVE</span></div>
  <div class="tile-body" id="tick" hx-get="/tick" hx-trigger="every 1s" hx-swap="innerHTML">等待首次拉取…</div>
</div>

<div class="tile">
  <div class="tile-title">表单 + 热点</div>
  <div class="row">
    <input id="q" name="q" placeholder="输入关键字…">
    <button id="go" hx-post="/search" hx-target="tick">搜索</button>
  </div>
  <div class="note">输入值经 URL 编码后随 hx-post 发送; 鼠标悬停时按钮与卡片有过渡效果。</div>
</div>
</body></html>
