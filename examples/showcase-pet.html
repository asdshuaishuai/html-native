<html><head>
<!-- showcase-pet — 竞赛演示·桌宠窗(展示页)
     ============================================================
     透明悬浮形态本色出演: 逐像素 alpha + 无边框 + 悬浮级 + 跟随所有空间。
     角色: assets/showcase-pet.png(引擎 Canvas 2D 绘制后抠底落盘的资产)。
     活性: 网格正弦摆动(hn-mesh) + JS 眨眼(hnMeshParam) + 气泡轮播(hnSetText)。
-->
<meta charset="utf-8">
<meta name="hn-surface" content="popup">
<meta name="hn-window" content="360x360">
<meta name="hn-title" content="Neb 桌宠">
<meta name="hn-transparent" content="1">
<meta name="hn-frameless" content="1">
<meta name="hn-level" content="floating">
<meta name="hn-spaces" content="all">
<meta name="hn-shadow" content="0">
<meta name="hn-draggable" content="1">
<style>
  html, body { margin: 0; width: 100%; height: 100%; }

  /* 气泡: 深色玻璃感, 文案由 JS 每 4s 轮播 */
  .bubble { position: absolute; left: 34; top: 18; width: 292; box-sizing: border-box;
            padding: 10 14; text-align: center; font-size: 12.5; line-height: 1.5;
            color: #eef4fb; background: rgba(18, 24, 38, 0.9);
            border: 1 solid rgba(79, 216, 200, 0.4); border-radius: 16; }
  .bubble:after { content: ""; }

  /* 角色: 网格摆动(anchor=bottom: 根部固定梢部摆) + JS 眨眼 */
  .pet { position: absolute; left: 50; top: 96; width: 260; height: 260; }
  .pet img { width: 260; height: 260; }

  /* 落地影 + 状态点 */
  .shadow { position: absolute; left: 116; top: 336; width: 128; height: 14;
            background: rgba(0, 0, 0, 0.28); border-radius: 50%; }
  .dot { position: absolute; left: 300; top: 118; width: 12; height: 12;
         background: #4fd8c8; border-radius: 50%;
         animation: dot-breath 2.6s ease-in-out infinite; }
  @keyframes dot-breath { 0% { opacity: 0.45; } 50% { opacity: 1; } 100% { opacity: 0.45; } }
</style>
</head><body>
  <div class="bubble" id="say">你好, 我是 Neb 桌宠 — 整个窗口都是native的</div>
  <div class="pet">
    <img id="p" src="assets/showcase-pet.png" hn-mesh="12x12"
         hn-mesh-sway="7" hn-mesh-speed="1.2" hn-mesh-anchor="bottom">
  </div>
  <div class="shadow"></div>
  <div class="dot"></div>

<script>
/* 眨眼: eye 参数 1=睁 0=闭(hnMeshParam 与官方 Live2D rig 同一通道) */
var pet = document.getElementById('p');
function blink() {
  hnMeshParam('p', 'eye', 0.05);
  setTimeout(function () { hnMeshParam('p', 'eye', 1); }, 140);
  setTimeout(blink, 2600 + Math.floor(Math.sin(Date.now()) * 900));
}
setTimeout(blink, 1200);

/* 气泡轮播: 文案即数据, 换句不重排版面 */
var lines = [
  '你好, 我是 Neb 桌宠 — 整窗native, 逐像素透明',
  '我动起来靠的是引擎网格变形, 不用浏览器',
  '拖我可以随处放 — 无边框悬浮窗, 常驻桌面',
  '一份 HTML 声明窗体, agent 写页面像写卡片'
];
var li = 0;
setInterval(function () {
  li = (li + 1) % lines.length;
  hnSetText('say', lines[li]);
}, 4000);
</script>
</body></html>
