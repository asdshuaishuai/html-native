     三条链条各验一件事:
       inc-a.html → inc-b.html → 回引本文   环检测(应截断为注释占位)
       ghost.html(不存在)                  缺文件容错(占位, 装载不失败)

     被 tools/include_probe.c 断言, 也是"include 一次, 三层全展开"的最小样例。 -->

<body style="margin:0">
  <h1 id="main-h" style="font-size:18px">inc-main-head</h1>
  <include src="inc-a.html">
  <include src="sub/inc-c.html">
  <include src="ghost.html">
  <p id="main-tail">inc-main-tail</p>
</body></html>
