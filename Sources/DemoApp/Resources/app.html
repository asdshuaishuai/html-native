<html>
<head>
<style>
  html, body { margin: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="app">
    <!-- 顶栏: 红绿灯 + 标题 + 实时时钟(本地 set_text 热更新) -->
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="title">html-native · 系统监视器</div>
      <div class="spacer"></div>
      <div id="clock" class="clock">--:--:--</div>
    </div>

    <div class="body">
      <!-- 侧栏导航: hx-get 声明式拉取面板片段 -->
      <div class="sidebar">
        <div class="nav-item active" hx-get="/panel/overview" hx-target="panel">概览</div>
        <div class="nav-item" hx-get="/panel/cpu" hx-target="panel">CPU</div>
        <div class="nav-item" hx-get="/panel/memory" hx-target="panel">内存</div>
        <div class="nav-item" hx-get="/panel/disk" hx-target="panel">磁盘</div>
        <div class="nav-item" hx-get="/panel/net" hx-target="panel">网络</div>
        <div class="spacer"></div>
        <div class="ver">html-native v0.1 · 无浏览器</div>
      </div>

      <!-- 主面板: 页面载入时 hx-trigger="load" 自动拉取 -->
      <div class="main">
        <div id="panel" hx-get="/panel/overview" hx-trigger="load" hx-swap="innerHTML">
          <div class="loading">正在加载面板…</div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="statusbar">
      <div>原生渲染 · CoreText + CoreGraphics · htmx 片段流</div>
      <div class="spacer"></div>
      <div id="status">就绪</div>
    </div>
  </div>
</body>
</html>
