[package]
name = "neb3-wgpu"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional Rust/wgpu 3D backend for the Neb engine (C ABI)"
repository = "https://github.com/asdshuaishuai/html-native"

[lib]
name = "neb3_wgpu"
# rlib: cargo examples/tests need a linkable form; cdylib: dlopen host;
# staticlib: static link into C builds.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Phase B: real wgpu pipeline (was zero-dep ABI skeleton in Phase A).
# wgpu 30: Metal-first adapter pick, MSAA resolve, Depth24Plus, RGBA8 readback.
wgpu = "30.0.1"
# glam: view/proj/model matrices for the unlit box pipeline.
glam = "0.34.1"
